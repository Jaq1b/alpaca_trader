paper_trading: true
data_dir: trading_data
initial_capital: 1000.0

symbols:
  # watchlist = PRIORITY_SYMBOLS (full scan each loop). Also: ticker list, top_N, all.
  stocks: watchlist
  # Keep >= watchlist length for full coverage. Bars are batched + TTL-cached.
  scan_batch_size: 100
  crypto:
    - BTC/USD
    - ETH/USD
    - SOL/USD
    - XRP/USD
    - DOGE/USD

risk:
  # Fraction of equity risked if the stop is hit (not buying power).
  crypto_per_trade: 0.006
  stock_per_trade: 0.008
  # 0 = no slot cap; per-trade max notional + equity gate deployment.
  max_positions: 0
  min_hold_seconds: 300
  check_interval_seconds: 45
  max_position_value_crypto: 2000.0
  max_position_value_stock: 4000.0
  min_position_value: 250.0
  allow_shorting: true  # stocks only; crypto stays long-only

strategy:
  signal_cooldown: 300
  buy_score_min: 5
  buy_score_min_crypto: 5
  sell_score_min: 4
  max_recent_losses: 2
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  atr_period: 14
  atr_stop_mult: 2.5
  # Floor so 5Min ATR cannot place sub-1% stops that slippage blows through.
  min_stop_pct_stock: 0.008
  min_stop_pct_crypto: 0.015
  atr_trail_mult: 2.0
  trail_arm_atr_mult: 1.5
  volume_mult_stock: 1.4
  volume_mult_crypto: 1.25
  take_profit_pct_stock: 4.0
  take_profit_pct_crypto: 6.0
  solid_profit_pct_stock: 2.5
  solid_profit_pct_crypto: 4.0
  min_bars: 40

cache:
  bars_ttl_seconds: 90
  price_ttl_seconds: 15
  account_ttl_seconds: 10
  positions_ttl_seconds: 10
  clock_ttl_seconds: 30
  calendar_ttl_seconds: 3600

backtest:
  lookback_days: 30
  initial_capital: 10000.0
  timeframe: 5Min
  bar_limit: 5000
